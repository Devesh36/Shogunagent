packages:
  - 'apps/*'
  - 'packages/*'

# Patched transitive versions while Vitest 3 / its Workers pool pin older tool
# dependencies. Recheck these overrides when upgrading the test runner and pool.
overrides:
  'tinypool@<2.1.2': '2.1.2'
  'undici@>=7.0.0 <7.30.1': '7.30.1'
  'sharp@<0.35.5': '0.35.5'
  'ws@>=8.0.0 <8.21.0': '8.21.0'

[package]
name = "extract-eval"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "SHOGUN state-extraction eval: SynthDay golden days, a per-field scorer with provenance and confidence-calibration checks, and model-free runners (issue #317)."

# Model-free and platform-independent, like pii-bench / ax-noise-bench: it runs inside
# `cargo test --workspace` on Linux CI (CLAUDE.md CI budget rules — never a macOS job).
#
# Deliberately NOT a dependent of shogun-core. The Dream Cycle's `LocalRuleClassifier` and Batch
# parse path live behind shogun-core's `db` feature; depending on it with `db` here would unify
# that feature into every crate of the workspace test build and silently drop the no-`db` build
# of shogun-core from CI. Those two runners are driven from `crates/shogun-core/tests/extract_eval.rs`
# instead (a `db` test target, which CI's `cargo test -p shogun-core --features db` step runs),
# with this crate as its dev-dependency.
#
# No HTTP client, no model, no network: every input is a checked-in synthetic file generated from
# the fixed templates in `src/templates.rs` (FR-TR-03 / invariant 3; `scripts/check-http-egress.py`).

[dependencies]
shogun-memory = { path = "../shogun-memory" }
shogun-fusion = { path = "../shogun-fusion" }
shogun-redact = { path = "../shogun-redact" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "extract-eval"
path = "src/bin/extract_eval.rs"

[lints]
workspace = true

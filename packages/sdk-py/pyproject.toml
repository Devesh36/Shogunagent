[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "shogunagent"
version = "0.1.0"
description = "Python client of ShogunAgent, the state layer for AI agents: recall, ingest, state reads, permission-tiered actions, the router, quotes and typed A2A handoffs, plus with_shogun_agent() middleware for the OpenAI Agents SDK, Claude Agent SDK, LangGraph and CrewAI."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
keywords = ["agents", "memory", "state", "mcp", "a2a", "langgraph", "crewai", "openai-agents", "claude-agent-sdk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://shogunagent.dev"
Repository = "https://github.com/Torutesu/Shogunagent"

[tool.hatch.build.targets.wheel]
packages = ["src/shogunagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

{{- if .Values.secrets.create }}
# Evaluation only (values.yaml `secrets.create`): these values are stored in Helm's release record.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shogunagent.secretName" . }}
  labels:
    {{- include "shogunagent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

{{- $secret := include "shogunagent.secretName" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "shogunagent.fullname" . }}
  labels:
    {{- include "shogunagent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "shogunagent.fullname" . }}-headless
  # Replicas own disjoint principals (deploy/README.md "Sharding"); they start and stop together.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "shogunagent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shogunagent.selectorLabels" . | nindent 8 }}
        shogunagent.dev/region: {{ .Values.region | quote }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "shogunagent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sidecar
          image: {{ include "shogunagent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --multi
            - {{ .Values.sidecar.principalsDir | quote }}
            - --key-provider
            - {{ .Values.keyProvider.type | quote }}
            {{- range .Values.sidecar.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "shogunagent.fullname" . }}-config
            {{- if $secret }}
            - secretRef:
                name: {{ $secret }}
            {{- end }}
          {{- with .Values.sidecar.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          livenessProbe:
            {{- include "shogunagent.statusProbe" . | nindent 12 }}
            {{- toYaml .Values.sidecar.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- include "shogunagent.statusProbe" . | nindent 12 }}
            {{- toYaml .Values.sidecar.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.sidecar.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.embedLocal.enabled }}
            - name: models
              mountPath: /models
              readOnly: true
            - name: onnxruntime
              mountPath: /opt/onnxruntime
              readOnly: true
            {{- end }}
        {{- if .Values.gateway.enabled }}
        - name: gateway
          image: {{ printf "%s:%s" .Values.gateway.image.repository .Values.gateway.image.tag | quote }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: gateway
              containerPort: {{ .Values.gateway.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.gateway.port | quote }}
            # The sidecar in this pod (loopback only).
            - name: SHOGUN_SIDECAR_URL
              value: {{ printf "http://127.0.0.1:%v" .Values.sidecar.port | quote }}
            - name: SHOGUN_REGION
              value: {{ .Values.region | quote }}
            {{- range $name, $value := .Values.gateway.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if $secret }}
          envFrom:
            - secretRef:
                name: {{ $secret }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: gateway
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: gateway
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: gateway-tmp
              mountPath: /tmp
        {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        {{- if .Values.gateway.enabled }}
        - name: gateway-tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- end }}
        {{- if .Values.embedLocal.enabled }}
        {{- if not .Values.embedLocal.modelsVolume }}
        {{- fail "embedLocal.modelsVolume is required when embedLocal.enabled" }}
        {{- end }}
        {{- if not .Values.embedLocal.onnxRuntimeVolume }}
        {{- fail "embedLocal.onnxRuntimeVolume is required when embedLocal.enabled" }}
        {{- end }}
        - name: models
          {{- toYaml .Values.embedLocal.modelsVolume | nindent 10 }}
        - name: onnxruntime
          {{- toYaml .Values.embedLocal.onnxRuntimeVolume | nindent 10 }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "shogunagent.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}

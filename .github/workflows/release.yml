name: release

# Tag `v*` on main: Linux x86_64 and arm64 binaries (shogun-api, shogun-mcp, shogun) and a
# multi-arch container image on GHCR. macOS arm64 binaries are added once a macOS runner is
# budgeted; until then the Mac path is the ShogunAI app.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_INCREMENTAL: "0"

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y clang pkg-config
      - name: build
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p shogun-core --features daemon-server --bin shogun-api --bin shogun-mcp
          cargo build --release --locked --target ${{ matrix.target }} -p shogun-cli --bin shogun
      - name: package
        run: |
          set -euo pipefail
          out=shogunagent-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p "$out"
          cp target/${{ matrix.target }}/release/{shogun-api,shogun-mcp,shogun} "$out/"
          cp LICENSE README.md SKILL.md "$out/"
          tar -czf "$out.tar.gz" "$out"
          sha256sum "$out.tar.gz" > "$out.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            shogunagent-*.tar.gz
            shogunagent-*.tar.gz.sha256

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/shogunagent:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/shogunagent:latest

  github-release:
    needs: [binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true

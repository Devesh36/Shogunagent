name: deploy-check

# BYOC deployment artifacts (E26): lint and render the Helm chart with its default values and every
# deploy/helm/shogunagent/ci/*.yaml, schema-check the output with kubeconform, confirm the chart
# refuses settings that cannot work, and validate the compose file. Runs only when deploy/ (or this
# workflow) changes. Everything is in deploy/check.sh, which runs the same way locally.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "deploy/**"
      - ".github/workflows/deploy-check.yml"
  push:
    branches: ["main"]
    paths:
      - "deploy/**"
      - ".github/workflows/deploy-check.yml"

permissions:
  contents: read

concurrency:
  group: deploy-check-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v3.16.4
  KUBECONFORM_VERSION: v0.6.7

jobs:
  deploy:
    name: helm chart and compose
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: install kubeconform
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: deploy/check.sh
        run: deploy/check.sh

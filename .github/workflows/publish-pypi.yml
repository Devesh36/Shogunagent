name: publish PyPI

# E40 (preparation only). Publishes the `shogunagent` Python SDK (packages/sdk-py).
# - Runs only when started by hand (workflow_dispatch) from main. Nothing publishes on push or tag.
# - `dry_run` defaults to true: test, `python -m build`, `twine check` only.
# - The real publish job waits for the `release` environment's required reviewers (the owner) and
#   uses PyPI trusted publishing (OIDC, `id-token: write`) through pypa/gh-action-pypi-publish,
#   which also uploads PEP 740 attestations. No PyPI token is stored anywhere.
# Procedure, versioning and changelog policy: docs/release.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The exact version in pyproject.toml (typed again as a check, e.g. 0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Test, build and twine check only"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    name: build shogunagent ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Publish from main only (this run is on ${GITHUB_REF})." >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: versions agree (pyproject, SDK_VERSION, CHANGELOG section, the typed version)
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/check-release-versions.mjs --package py --expect "$VERSION"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: tests (unit and real-framework integration, offline)
        env:
          SHOGUNAGENT_REQUIRE_INTEGRATION: "1"
        run: |
          python -m pip install -e 'packages/sdk-py[test,integration]'
          cd packages/sdk-py && python -m pytest -q
      - name: python -m build + twine check
        run: |
          python -m pip install build twine
          python -m build --outdir dist packages/sdk-py
          python -m twine check --strict dist/*
      - name: the version is not on PyPI yet (anonymous read)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/shogunagent/${VERSION}/json")
          if [ "$status" = "200" ]; then
            echo "shogunagent ${VERSION} is already on PyPI; bump the version (docs/release.md)." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          retention-days: 7

  publish:
    name: publish shogunagent ${{ inputs.version }} to PyPI
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://pypi.org/project/shogunagent/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - name: upload (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

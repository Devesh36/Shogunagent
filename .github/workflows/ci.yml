name: CI

# Linux only. Every workspace member builds and tests here; there is no macOS-only crate.
# Mirrors the local verification block in CLAUDE.md.

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: rust (clippy, test, feature matrix)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: feature matrix (clippy + test for every CI feature combination)
        run: scripts/check-feature-matrix.sh

  guards:
    name: invariant guards
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: guards (self-test, then the tree)
        run: |
          set -euo pipefail
          for g in http-egress secret-exposure media-writes log-hygiene migrations batch-source-filter desktop-gate; do
            python3 scripts/check-$g.py --self-test
            python3 scripts/check-$g.py
          done

  relay:
    name: apps/api (typecheck, node tests)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shogun-ai/api typecheck
      - run: pnpm --filter @shogun-ai/api test:node

  agent-surfaces:
    name: agent-readable surfaces (E10: generated files match, registry entry valid, CLI)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Invariant 12: the committed agent-readable files equal what the generators produce.
      - name: llms.txt / llms-full.txt are generated from the docs (E10-T4)
        run: node scripts/gen-llms-txt.mjs --check
      - name: /privacy and /terms are generated from docs/legal (E23)
        run: node scripts/gen-legal-pages.mjs --check
      - name: the agent card's skills are generated from SKILL.md (E10-T3)
        run: node scripts/gen-agent-skills.mjs --check
      - name: server.json validates against the MCP Registry schema (E10-T2)
        run: pnpm registry:validate
      - name: npx shogunagent (E10-T10)
        run: |
          pnpm --filter shogunagent typecheck
          pnpm --filter shogunagent test
          pnpm --filter shogunagent build

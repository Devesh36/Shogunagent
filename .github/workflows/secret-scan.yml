name: secret-scan

# E48, threat model R8: gitleaks over the tree and over the commits a change adds. Linux only, no
# secrets, read-only token. Synthetic fixtures (redaction tests, the PII bench) are allowlisted in
# .gitleaks.toml; findings are printed redacted, so a real secret never lands in the job log.
#
# gitleaks is a pinned release binary, checked against the release's own checksum file before it
# runs (the gitleaks-action needs a licence key for organisation repositories).

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.21.2"

jobs:
  gitleaks:
    name: gitleaks (tree and new commits)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks ${{ env.GITLEAKS_VERSION }} (checksum-verified)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          cd "$dir"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" "$base/$tarball"
          curl -fsSL --retry 3 -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          echo "$dir" >> "$GITHUB_PATH"
      - name: scan the checked-out tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1
      - name: scan the commits this change adds
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A new branch or a manual run has no "before": the tree scan above covers it.
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit; tree scan only"
            exit 0
          fi
          gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="${BASE_SHA}..${HEAD_SHA}"
